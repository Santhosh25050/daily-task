<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow - a simple personal task manager">
  <title>TaskFlow | My Tasks</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="logo" href="#" aria-label="TaskFlow home">
        <span class="logo-icon">✓</span> TaskFlow
      </a>
      <span class="status">MY WORKSPACE</span>
    </header>

    <section class="intro">
      <p class="eyebrow">YOUR PERSONAL PLANNER</p>
      <h1>Make today<br>count<span>.</span></h1>
      <p class="subtitle">Small steps. Big progress. One task at a time.</p>
    </section>

    <section class="task-panel" aria-labelledby="task-heading">
      <div class="panel-heading">
        <div>
          <h2 id="task-heading">My tasks</h2>
          <p id="date"></p>
        </div>
        <span class="task-badge" id="total-count">0 tasks</span>
      </div>

      <form id="task-form">
        <label class="sr-only" for="task-input">Enter a new task</label>
        <input
          id="task-input"
          type="text"
          placeholder="What needs to get done?"
          maxlength="120"
          autocomplete="off"
          required
        >
        <button class="add-btn" type="submit">+ Add task</button>
      </form>

      <div class="filters" aria-label="Filter tasks">
        <button class="filter active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="pending">Pending</button>
        <button class="filter" type="button" data-filter="completed">Completed</button>
      </div>

      <ul id="task-list" aria-label="Task list"></ul>

      <p id="empty-message" class="empty-message">
        No tasks here yet. Add one to get started!
      </p>

      <div class="summary">
        <span><strong id="pending-count">0</strong> pending</span>
        <span><strong id="completed-count">0</strong> completed</span>
      </div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </section>

    <footer>
      <span>Designed for a more focused day.</span>
      <button id="clear-completed" class="clear-btn" type="button">
        Clear completed
      </button>
    </footer>
  </main>
</body>
</html>
